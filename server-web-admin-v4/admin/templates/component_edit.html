{% extends 'base.html' %}{% block heading %}Sửa Component{% endblock %}{% block content %}<section class="panel"><div class="panelhead"><div><h2>{{component_id}}</h2><p>{{screen}} → {{layout_id}}. Sửa toàn bộ JSON của component này.</p></div><a href="{{url_for('builder',screen=screen)}}">← Quay lại Builder</a></div><form method="post"><input type="hidden" name="_csrf" value="{{csrf_token()}}"><input type="hidden" name="screen" value="{{screen}}"><input type="hidden" name="layout_id" value="{{layout_id}}"><input type="hidden" name="component_id" value="{{component_id}}"><textarea class="jsonarea" name="raw" spellcheck="false">{{raw}}</textarea><div class="formfoot"><span class="muted">Component được validate trước khi lưu.</span><button class="btn">Lưu Component</button></div></form></section>{% endblock %}
