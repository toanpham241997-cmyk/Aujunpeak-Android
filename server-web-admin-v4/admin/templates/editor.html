{% extends 'base.html' %}{% block heading %}JSON Editor{% endblock %}{% block content %}<section class="panel"><div class="panelhead"><div><h2>ui.json</h2><p>Save Draft chưa update người dùng. Publish mới phát hành.</p></div><div><button type="button" class="ghost" onclick="fmt()">Format JSON</button></div></div><form method="post"><input type="hidden" name="_csrf" value="{{csrf_token()}}"><textarea id="raw" class="jsonarea" name="raw" spellcheck="false">{{raw}}</textarea><div class="formfoot"><span id="st" class="muted">Schema 2</span><button class="btn">Lưu bản nháp</button></div></form></section>{% endblock %}{% block scripts %}<script>function fmt(){let e=document.getElementById('raw');try{e.value=JSON.stringify(JSON.parse(e.value),null,2);st.textContent='JSON hợp lệ ✓'}catch(x){st.textContent='Lỗi: '+x.message}}</script>{% endblock %}
